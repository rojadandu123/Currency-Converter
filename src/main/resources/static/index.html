<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="custom-bg h-screen flex items-center justify-center font-sans antialiased">

    <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full mx-4 border border-gray-100">
        
        <div class="mb-6 text-center">
            <h2 class="text-2xl font-bold text-gray-800 tracking-tight">Currency Converter</h2>
        </div>
        
        <form id="converterForm" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Amount
                </label>
                <input type="number" id="amount" required min="0.01" step="any" placeholder="Enter amount"
                    class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg text-gray-800 transition">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        From
                    </label>
                    <select id="fromCurrency" class="w-full px-3 py-3 bg-white border border-gray-200 rounded-xl text-sm font-medium text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                        <option value="USD">USD - US Dollar</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="GBP">GBP - British Pound</option>
                        <option value="INR">INR - Indian Rupee</option>
                        <option value="AUD">AUD - Australian Dollar</option>
                        <option value="CAD">CAD - Canadian Dollar</option>
                        <option value="SGD">SGD - Singapore Dollar</option>
                        <option value="JPY">JPY - Japanese Yen</option>
                        <option value="CNY">CNY - Chinese Yuan</option>
                        <option value="AED" selected>AED - UAE Dirham</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        To
                    </label>
                    <select id="toCurrency" class="w-full px-3 py-3 bg-white border border-gray-200 rounded-xl text-sm font-medium text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                        <option value="INR" selected>INR - Indian Rupee</option>
                        <option value="USD">USD - US Dollar</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="GBP">GBP - British Pound</option>
                        <option value="AUD">AUD - Australian Dollar</option>
                        <option value="CAD">CAD - Canadian Dollar</option>
                        <option value="SGD">SGD - Singapore Dollar</option>
                        <option value="JPY">JPY - Japanese Yen</option>
                        <option value="CNY">CNY - Chinese Yuan</option>
                        <option value="AED">AED - UAE Dirham</option>
                    </select>
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3.5 px-4 rounded-xl transition duration-150 shadow-md">
                Convert Currency
            </button>
        </form>

        <div id="resultContainer" class="hidden mt-6 p-5 bg-emerald-50 border border-emerald-100 rounded-xl text-center">
            <p class="text-xs font-bold text-emerald-600 uppercase tracking-wider mb-1">Converted Amount:</p>
            <p id="resultValue" class="text-2xl font-bold text-emerald-700">0.00 INR</p>
        </div>
        
        <div id="errorContainer" class="hidden mt-6 p-4 bg-red-50 text-red-700 rounded-xl text-xs font-semibold text-center border border-red-100">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
